name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Blocking, not advisory. A type check nobody has to fix is one nobody reads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy massingplan

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=massingplan --cov-report=term-missing

  postgres:
    # SQLite is what developers run; Postgres is what production runs. The
    # differences are silent -- no native enum, foreign keys off by default,
    # naive datetimes from a timezone-aware column. Each has caused a bug here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: massingplan
          POSTGRES_PASSWORD: massingplan
          POSTGRES_DB: massingplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U massingplan"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      MASSINGPLAN_TEST_POSTGRES_URL: postgresql+psycopg://massingplan:massingplan@localhost:5432/massingplan
      MASSINGPLAN_DATABASE_URL: postgresql+psycopg://massingplan:massingplan@localhost:5432/massingplan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: Migrate up, down and up again on Postgres
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run the dialect suite against Postgres
        run: pytest tests/test_dialects.py -q
      - name: Prove the Postgres tests did not silently skip
        # `-q` prints "3 passed, 2 skipped" just as happily either way. Without
        # this the job is green whether or not the database was ever reached.
        run: |
          pytest tests/test_dialects.py -q -rs 2>&1 | tee out.txt
          if grep -q "MASSINGPLAN_TEST_POSTGRES_URL" out.txt; then
            echo "::error::the Postgres tests skipped; the service was not reachable"
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Up, down, up, and no autogenerate drift
        # `alembic check` is the important one: it fails when a model has
        # changed and nobody wrote the migration, which otherwise surfaces as a
        # missing column in production.
        env:
          MASSINGPLAN_DATABASE_URL: sqlite:///ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  timeaxis-kernel:
    # The one invariant every other module assumes without checking. A lattice
    # optimisation that shaves a branch cannot land without someone proving the
    # branch was unreachable. See SPEC.md 8.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          pytest tests/test_timeaxis_kernel.py -q \
            --cov=massingplan.core.timeaxis --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

  frontend:
    # The one JavaScript file, type-checked in place against its own JSDoc.
    #
    # Nothing checked it before, and the cost was not cosmetic: the Gantt drew
    # no dependency arrows on any page, because `to_rows()` never carried
    # `predecessors` and the renderer read `(row.predecessors || [])`. An absent
    # contract became an empty list and the feature was silently missing.
    #
    # `--noEmit`: this is a checker, not a build. The file served to the browser
    # is the file in the repo, which is what keeps `default-src 'self'` honest
    # and the deployment a copy rather than a pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes --package typescript@5 -- tsc -p jsconfig.json

  adversarial:
    # The app attacked on purpose: cross-tenant reads, session fixation, open
    # redirect, stored XSS, header injection, mass assignment, XXE. Not a
    # substitute for a penetration test -- SECURITY.md still says nobody outside
    # the project has tried to break this. What it is: the classes of bug a
    # pentest finds *and that a regression could quietly reintroduce*, so the
    # second time is caught here rather than in a report.
    #
    # Its own job so a failure is unmistakable in the checks list. A security
    # regression buried in "tests (3.12)" among six hundred dots is a security
    # regression somebody merges.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_adversarial.py -q

  performance:
    # Complexity regressions, not stopwatch times. The wall-clock budgets carry
    # roughly a 10x margin over a developer machine so a busy runner does not
    # fail the build; the two ratio assertions are the ones that matter, because
    # "10x the input took 100x the time" holds on any hardware.
    #
    # `--durations` so a run that passes but got slower leaves a trace in the
    # log, rather than the first anybody hears being the failure two months on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # `-m performance` overrides the `-m 'not performance'` in pyproject's
      # addopts, which keeps these out of the main run. This job is the only
      # place they execute.
      - run: pytest tests/test_performance.py -q -m performance --durations=12

  determinism:
    # Same input, same answer -- across runs and hash seeds. Without a
    # total-order tiebreak on every sort, set iteration order leaks into
    # levelling and the same file produces different dates between runs. An
    # optimiser whose answer changes cannot be reviewed, approved, or defended.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run the suite under two different hash seeds
        run: |
          PYTHONHASHSEED=0 pytest tests -q
          PYTHONHASHSEED=524287 pytest tests -q

  purity:
    # `core` is copied verbatim into another product's source tree, where none
    # of this repo's dependencies are guaranteed to exist. This proves it
    # imports with nothing but the standard library -- the contract in
    # pyproject.toml is checked statically, this checks it for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import every core module with no dependencies installed
        run: |
          python - <<'PY'
          import importlib
          import pathlib
          import sys

          sys.path.insert(0, ".")
          failures = []
          for path in sorted(pathlib.Path("massingplan/core").glob("*.py")):
              name = f"massingplan.core.{path.stem}"
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append(f"{name}: {exc}")
          if failures:
              raise SystemExit("core is not pure:\n  " + "\n  ".join(failures))
          print("core imports clean on a bare interpreter")
          PY

  offline:
    # Imports and serves with the network dropped. A standalone product that
    # cannot boot without reaching a host is not standalone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_offline.py

  no-adapters:
    # Delete every optional adapter and re-run the suite. The decoupling is a
    # build failure, not a code-review opinion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          rm -f massingplan/services/entitlement/massing_cloud.py
          rm -f massingplan/services/identity/oidc.py
          rm -f massingplan/services/storage/s3.py
          pytest -q

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: lint-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres,server]"
      - name: Known vulnerabilities in the dependency tree
        # Not `--strict`: pip-audit exits non-zero on its own lookup failures
        # too, and a red build caused by the advisory service being down is a
        # red build people learn to ignore.
        run: |
          pip install pip-audit
          pip-audit --skip-editable
      - name: Software bill of materials
        run: |
          # Pinned. `cyclonedx-bom` renamed `--outfile` to `--output-file`
          # between majors, and an unpinned tool in a security job means the job
          # breaks on someone else's release — which is a red build people learn
          # to ignore, in the one place that must not happen.
          pip install 'cyclonedx-bom>=7.0,<8.0'
          cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t massingplan:ci .
      - name: Boot it on SQLite and check both probes
        run: |
          docker run -d --name mp -p 8000:8000 \
            -e MASSINGPLAN_SECRET_KEY=ci-not-a-secret \
            massingplan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          # `/readyz` must be genuinely ready, not merely answering. A container
          # that reports itself healthy while nothing works is the failure this
          # step exists to catch.
          #
          # Whitespace-tolerant: Flask serialises compactly outside debug, so the
          # body is `{"status":"ready"}` with no space. Matching the pretty form
          # made this step fail on a container that was working perfectly --
          # and `tests/test_deployment.py` only checked that the pattern existed
          # in this file, not that it matched anything.
          readyz=$(curl -fsS http://localhost:8000/readyz)
          echo "$readyz"
          echo "$readyz" | grep -Eq '"status" *: *"ready"'
      - name: Refuse to boot without a secret key
        run: |
          if docker run --rm -e MASSINGPLAN_SECRET_KEY= massingplan:ci massingplan check; then
            echo "::error::the image booted in production mode with no secret key"
            exit 1
          fi
      - name: Container logs on failure
        if: failure()
        run: docker logs mp || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
